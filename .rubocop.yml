AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"

# Generated: one operation per line, so drift reads as one-line diffs.
Layout/LineLength:
  Exclude:
    - "lib/pennylane_client/operations.rb"

Metrics/ModuleLength:
  Exclude:
    - "lib/pennylane_client/operations.rb"

# A load or stress scenario reads best top to bottom: set up the fake, run
# the threads, report, assert. Split to fit these, one scenario scatters
# across helpers. The library itself stays inside them.
Metrics/AbcSize:
  Exclude:
    - "perf/**/*"

Metrics/MethodLength:
  Exclude:
    - "perf/**/*"

# Client is configured with keyword options, each with a default; the count
# of positional parameters is what hurts readability.
Metrics/ParameterLists:
  CountKeywordArgs: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
