name: Bug report
description: Report a problem with pennylane_client
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: What you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code to reproduce the problem. Redact tokens and secrets.
      render: ruby
    validations:
      required: true
  - type: input
    id: operation
    attributes:
      label: Pennylane operationId(s) involved
      description: For example getCustomerInvoices. Leave blank if not applicable.
    validations:
      required: false
  - type: input
    id: gem-version
    attributes:
      label: pennylane_client version
    validations:
      required: true
  - type: input
    id: ruby-version
    attributes:
      label: Ruby version
      description: Output of `ruby -v`.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Error messages or backtraces. Redact tokens and secrets.
    validations:
      required: false
